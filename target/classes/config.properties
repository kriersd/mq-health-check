# ==============================================================================
# Filename: src/main/resources/config.properties
# Purpose: Core configuration for IBM MQ Health Check API and Dashboard.
#          Defines branding, endpoints, file-system directories, and custom severities
#          for each of the 12 health checks to support F5 load balancer pooling.
# Sensitive-Data Handling: Sensitive credentials or local paths are marked as SENSITIVE
#                           and should be overridden in the runtime .env file.
# ==============================================================================

# Application Branding & Server Settings
app.name=IBM MQ High-Availability Monitor
app.env=Production
app.port=8080

# ------------------------------------------------------------------------------
# IBM MQ Server Connection Details
# ------------------------------------------------------------------------------
mq.host=CHANGE_ME
mq.port=1414
mq.channel=SYSTEM.DEF.SVRCONN
mq.queueManager=QM1
mq.testQueue=DEV.QUEUE.1
mq.dlqName=SYSTEM.DEAD.LETTER.QUEUE

# ------------------------------------------------------------------------------
# Host-Local Direct Paths (For out-of-REST direct verification)
# ------------------------------------------------------------------------------
# SENSITIVE: Path to the local queue manager configuration ini file
mq.iniPath=/var/mqm/qmgrs/QM1/qm.ini
# SENSITIVE: Path to the local MQ data mount directory for disk space checking
mq.dataPath=/var/mqm
# SENSITIVE: Path to JKS or PKCS12 keystore file for certificate expiration checks
mq.keystorePath=CHANGE_ME
# SENSITIVE: Keystore password to authenticate and inspect certificates
mq.keystorePassword=CHANGE_ME

# ------------------------------------------------------------------------------
# Security Credentials
# ------------------------------------------------------------------------------
# SENSITIVE: Sourced from .env at runtime
mq.username=CHANGE_ME
# SENSITIVE: Sourced from .env at runtime
mq.password=CHANGE_ME

# ------------------------------------------------------------------------------
# TLS Connectivity Settings (Required if using secure client connect check)
# ------------------------------------------------------------------------------
# SENSITIVE: Sourced from .env at runtime
mq.sslCipherSuite=

# ------------------------------------------------------------------------------
# 12 Health Checks Configuration & F5 Severities
# Mapping choices:
# - member_failure : Failure is host-specific. Returns HTTP 503 so F5 drops this member.
# - pool_failure   : Failure affects the entire pool (e.g., LDAP or shared queues).
#                    Returns HTTP 200 DEGRADED to prevent pool-wide cascading outages.
# ------------------------------------------------------------------------------

# 1. TCP Listener Check (Is MQ Port accepting sockets?)
check.listener.enabled=true
check.listener.severity=member_failure

# 2. Queue Manager Process/Connect Check (Can we establish a basic local/client connect?)
check.qmgr_connect.enabled=true
check.qmgr_connect.severity=member_failure

# 3. Real Client Connect Check (Full App Connect with TLS and security auth credentials)
check.client_connect.enabled=true
check.client_connect.severity=member_failure

# 4. Max Channels Check (Reads local qm.ini and checks active channels vs MaxChannels)
check.max_channels.enabled=true
check.max_channels.severity=member_failure

# 5. Disk Space Check (Checks local /var/mqm partition space; fails if >95% full)
check.disk_space.enabled=true
check.disk_space.severity=member_failure

# 6. Certificate Expiry Check (Validates local keystore certificates; fails if expiring in <30 days)
check.cert_expiry.enabled=true
check.cert_expiry.severity=member_failure

# 7. Test Queue Access Check (Checks PUT/GET/INQUIRE capability on the test queue)
check.test_queue.enabled=true
check.test_queue.severity=pool_failure

# 8. Dead Letter Queue Depth Check (Fails if messages build up in the system DLQ)
check.dlq_depth.enabled=true
check.dlq_depth.severity=pool_failure
check.dlq_depth.threshold=10

# 9. Application Queue Depth Check (Checks if critical application queues are full)
check.app_queue_depth.enabled=true
check.app_queue_depth.severity=pool_failure
check.app_queue_depth.queues=DEV.QUEUE.1,DEV.QUEUE.2
check.app_queue_depth.threshold_pct=90

# 10. LDAP/Authentication Directory Check (Is external LDAP/Active Directory reachable?)
check.ldap.enabled=true
check.ldap.severity=pool_failure

# 11. Channel Status Check (Are critical sender/receiver or cluster channels RUNNING?)
check.channel_status.enabled=true
check.channel_status.severity=pool_failure
check.channel_status.channels=SYSTEM.DEF.SVRCONN,TO.QM2

# 12. Host OS Resource Check (Is system RAM or CPU exhausted?)
check.host_resources.enabled=true
check.host_resources.severity=member_failure
check.host_resources.cpu_limit=95
