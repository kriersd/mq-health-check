# Filename: src/main/resources/config.properties
# Purpose: Static application-level configuration for MQ and API server parameters.
# Sensitive-Data Handling: Sensitive credentials are marked with SENSITIVE comments and should be injected via environment variables.

# Application Identity & Branding
app.name=IBM MQ Monitor
app.env=Development

# IBM MQ Server Core Parameters
mq.host=CHANGE_ME
mq.port=1414
mq.channel=SYSTEM.DEF.SVRCONN
mq.queueManager=QM1
mq.testQueue=DEV.QUEUE.1

# IBM MQ Security Credentials (Default to environment variable injections)
# SENSITIVE: Keep as placeholder. Sensitive credentials must be loaded via environmental variables.
mq.username=CHANGE_ME
# SENSITIVE: Keep as placeholder. Sensitive credentials must be loaded via environmental variables.
mq.password=CHANGE_ME
