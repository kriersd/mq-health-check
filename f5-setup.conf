# ==============================================================================
# Filename: f5-setup.conf
# Purpose: F5 BIG-IP TMSH command script for configuring the HTTP Health Monitor and LTM Pool.
# Description: Defines F5 load balancer health probing rules.
#              HTTP 200 (UP/DEGRADED) is accepted, while HTTP 503 (DOWN) triggers failover.
# ==============================================================================

# 1. Create a custom HTTP / HTTPS Health Monitor querying /health/mq
# Probes every 10 seconds. Timeout is 31 seconds.
# Expected receive string looks for "status":"UP" or "status":"DEGRADED".
create ltm monitor http mq_health_monitor {
    defaults-from http
    interval 10
    timeout 31
    destination *:*
    send "GET /health/mq HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n"
    recv "(\"status\":\"UP\"|\"status\":\"DEGRADED\")"
}

# 2. Create the LTM Pool containing the cluster members
# Map server ports to 8080 (where our Javalin agent runs on the host nodes)
create ltm pool mq_cluster_pool {
    members {
        10.120.45.11:8080 { address 10.120.45.11 }
        10.120.45.12:8080 { address 10.120.45.12 }
    }
    monitor mq_health_monitor
}

# 3. Associate the load balancing method (e.g. Least Connections)
modify ltm pool mq_cluster_pool load-balancing-mode least-connections-member

# 4. Optional: Save BIG-IP system configuration
save sys config
